<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#6c63ff",
                        "background-light": "#f5f5f8",
                        "background-dark": "#0f0f13",
                        "surface-dark": "#1a1a24",
                        "elevated-dark": "#242434",
                        "border-dark": "#2a2a3d",
                    },
                    fontFamily: {
                        "display": ["Outfit", "sans-serif"],
                        "body": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Space Grotesk', sans-serif;
        }
        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen text-slate-900 dark:text-slate-100 flex flex-col">
<div class="layout-container flex h-full grow flex-col">
<!-- Top Navigation -->
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-border-dark px-10 py-4 bg-background-light dark:bg-background-dark">
<div class="flex items-center gap-4 text-primary">
<div class="size-8 flex items-center justify-center">
<span class="material-symbols-outlined text-3xl">grid_view</span>
</div>
<h2 class="text-slate-900 dark:text-white text-xl font-bold leading-tight tracking-tight font-outfit">SoundGrid</h2>
</div>
<div class="flex flex-1 justify-end gap-8 items-center">
<div class="size-10 rounded-full bg-elevated-dark border border-border-dark flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-slate-400">person</span>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex items-center justify-center p-6 md:p-12">
<div class="w-full max-w-[640px] bg-white dark:bg-surface-dark border border-slate-200 dark:border-border-dark rounded-lg shadow-2xl p-12 flex flex-col gap-10">
<!-- Header -->
<div class="flex flex-col gap-2 text-center">
<h1 class="text-slate-900 dark:text-white text-4xl font-bold tracking-tight font-outfit">Set up your profile</h1>
<p class="text-slate-500 dark:text-slate-400 text-lg">Introduce yourself to the SoundGrid community</p>
</div>
<!-- Avatar Upload Component -->
<div class="flex flex-col items-center gap-4">
<div class="relative group cursor-pointer">
<div class="size-32 rounded-full bg-slate-100 dark:bg-elevated-dark border-2 border-dashed border-slate-300 dark:border-border-dark flex items-center justify-center overflow-hidden transition-all hover:border-primary/50">
<span class="material-symbols-outlined text-4xl text-slate-400 dark:text-slate-500">account_circle</span>
</div>
<div class="absolute bottom-0 right-0 size-10 bg-primary rounded-full flex items-center justify-center text-white shadow-lg border-4 border-white dark:border-surface-dark group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-xl">add</span>
</div>
</div>
<div class="text-center">
<p class="text-slate-900 dark:text-white font-medium">Upload Profile Photo</p>
<p class="text-slate-500 dark:text-slate-400 text-sm">Min 400x400px, JPG or PNG</p>
</div>
</div>
<!-- Form Fields -->
<div class="flex flex-col gap-6">
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Display Name</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">person</span>
<input class="w-full bg-slate-50 dark:bg-elevated-dark border-none rounded-lg h-14 pl-12 pr-4 text-slate-900 dark:text-white placeholder:text-slate-500 focus:ring-2 focus:ring-primary/50 transition-all font-body" placeholder="Enter your artist or professional name" type="text"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Location</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">location_on</span>
<input class="w-full bg-slate-50 dark:bg-elevated-dark border-none rounded-lg h-14 pl-12 pr-4 text-slate-900 dark:text-white placeholder:text-slate-500 focus:ring-2 focus:ring-primary/50 transition-all font-body" placeholder="City, Country" type="text"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Genre</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">library_music</span>
<input class="w-full bg-slate-50 dark:bg-elevated-dark border-none rounded-lg h-14 pl-12 pr-4 text-slate-900 dark:text-white placeholder:text-slate-500 focus:ring-2 focus:ring-primary/50 transition-all font-body" placeholder="e.g. Electronic, Jazz, Hip Hop" type="text"/>
</div>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-lg text-lg transition-all transform active:scale-[0.98] shadow-lg shadow-primary/20 font-outfit mt-4">
                    Finish Setup
                </button>
<!-- Footer Info -->
<p class="text-center text-slate-500 dark:text-slate-500 text-sm">
                    By continuing, you agree to SoundGrid's <a class="text-primary hover:underline" href="#">Terms of Service</a>
</p>
</div>
</main>
<!-- Decorative elements -->
<div class="fixed top-20 -left-20 size-80 bg-primary/10 blur-[120px] rounded-full pointer-events-none"></div>
<div class="fixed bottom-0 -right-20 size-96 bg-primary/5 blur-[120px] rounded-full pointer-events-none"></div>
</div>
</body></html>
