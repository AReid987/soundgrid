[project]
name = "soundgrid-api"
version = "0.1.0"
description = "SoundGrid API - FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "SoundGrid Team"}
]
keywords = ["fastapi", "api", "music", "contracts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.27",
    "python-dotenv>=1.2.2",
    "stripe>=11.0.0",
    "boto3>=1.35.0",
    "reportlab>=4.2.0",
    "pypdf>=6.10.2",
    "cryptography>=46.0.7",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "black>=26.3.1",
    "respx>=0.21.0",
]

[tool.pdm]
distribution = false

[tool.pdm.build]
package-dir = "src"

[tool.pdm.scripts]
dev = "uv run fastapi dev src/soundgrid_api/main.py --reload --port 8000"
start = "uv run fastapi run src/soundgrid_api/main.py"
test = "uv run pytest"
test-cov = "uv run pytest --cov=src --cov-report=term-missing"
lint = "uv run ruff check ."
lint-fix = "uv run ruff check . --fix"
format = "uv run ruff format ."
typecheck = "uv run mypy src/"
format-check = "uv run ruff format . --check"
all-checks = { composite = ["lint", "format-check", "typecheck"] }

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
