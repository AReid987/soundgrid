<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;family=Outfit:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#6c63ff",
                        "background-light": "#f5f5f8",
                        "background-dark": "#0F0F13",
                        "surface": "#242434",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "outfit": ["Outfit", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .form-input:focus {
            box-shadow: 0 0 0 2px rgba(108, 99, 255, 0.5);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            background: #6c63ff;
            cursor: pointer;
            border-radius: 50%;
            border: 3px solid #0F0F13;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased overflow-x-hidden">
<div class="relative flex flex-col min-h-screen max-w-[480px] mx-auto bg-background-light dark:bg-background-dark shadow-2xl">
<!-- TopAppBar -->
<header class="sticky top-0 z-20 flex items-center bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md px-4 py-4 border-b border-primary/10">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">arrow_back_ios_new</span>
</button>
<h1 class="flex-1 text-center font-outfit text-xl font-semibold tracking-tight mr-10">Edit Metadata</h1>
</header>
<!-- Main Form Content -->
<main class="flex-1 p-6 pb-32 space-y-8">
<!-- Section: Basic Info -->
<section class="space-y-4">
<label class="block group">
<span class="block text-sm font-medium text-slate-500 dark:text-slate-400 mb-2 ml-1">Track Title</span>
<input class="w-full bg-slate-200 dark:bg-surface border-none rounded-2xl h-14 px-4 text-lg font-outfit focus:ring-2 focus:ring-primary text-slate-900 dark:text-slate-100 placeholder-slate-400" type="text" value="Neon Horizon"/>
</label>
<label class="block group">
<span class="block text-sm font-medium text-slate-500 dark:text-slate-400 mb-2 ml-1">Artist Name</span>
<input class="w-full bg-slate-200 dark:bg-surface border-none rounded-2xl h-14 px-4 text-lg font-outfit focus:ring-2 focus:ring-primary text-slate-900 dark:text-slate-100 placeholder-slate-400" type="text" value="SynthWave Collective"/>
</label>
</section>
<!-- Section: Technical Details (JetBrains Mono) -->
<section class="space-y-4">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-xl">settings_input_component</span>
<h2 class="text-sm font-bold uppercase tracking-widest text-primary">Technical Details</h2>
</div>
<div class="grid grid-cols-1 gap-4">
<label class="block">
<span class="block text-xs font-mono text-slate-500 dark:text-slate-400 mb-2 ml-1">ISRC CODE</span>
<input class="w-full bg-slate-200 dark:bg-surface border-none rounded-xl h-12 px-4 font-mono text-sm focus:ring-2 focus:ring-primary text-slate-900 dark:text-slate-100 uppercase" type="text" value="US-RC1-23-00456"/>
</label>
<div class="grid grid-cols-2 gap-4">
<label class="block">
<span class="block text-xs font-mono text-slate-500 dark:text-slate-400 mb-2 ml-1">BPM</span>
<input class="w-full bg-slate-200 dark:bg-surface border-none rounded-xl h-12 px-4 font-mono text-base focus:ring-2 focus:ring-primary text-slate-900 dark:text-slate-100" type="number" value="124"/>
</label>
<label class="block">
<span class="block text-xs font-mono text-slate-500 dark:text-slate-400 mb-2 ml-1">KEY</span>
<input class="w-full bg-slate-200 dark:bg-surface border-none rounded-xl h-12 px-4 font-mono text-base focus:ring-2 focus:ring-primary text-slate-900 dark:text-slate-100" type="text" value="F# Minor"/>
</label>
</div>
</div>
</section>
<!-- Tagging Section -->
<section class="space-y-4">
<div class="flex items-center justify-between mb-2">
<h2 class="text-sm font-bold uppercase tracking-widest text-slate-500">Mood &amp; Style</h2>
<button class="text-xs font-medium text-primary">Add New +</button>
</div>
<div class="flex flex-wrap gap-2">
<span class="px-4 py-2 bg-primary/20 text-primary border border-primary/30 rounded-full text-sm font-medium">Cinematic</span>
<span class="px-4 py-2 bg-primary/20 text-primary border border-primary/30 rounded-full text-sm font-medium">Driving</span>
<span class="px-4 py-2 bg-primary/20 text-primary border border-primary/30 rounded-full text-sm font-medium">Melancholy</span>
<span class="px-4 py-2 bg-slate-200 dark:bg-surface text-slate-600 dark:text-slate-400 border border-transparent rounded-full text-sm font-medium">Retro-Futuristic</span>
<span class="px-4 py-2 bg-slate-200 dark:bg-surface text-slate-600 dark:text-slate-400 border border-transparent rounded-full text-sm font-medium">Euphoric</span>
</div>
</section>
<!-- Ownership Split Section -->
<section class="space-y-6">
<h2 class="text-sm font-bold uppercase tracking-widest text-slate-500">Ownership Split</h2>
<div class="space-y-6 bg-slate-200/50 dark:bg-surface/50 p-5 rounded-2xl border border-primary/5">
<div class="space-y-3">
<div class="flex justify-between items-center px-1">
<span class="text-sm font-medium">Master Recording</span>
<span class="text-lg font-mono font-bold text-primary">80%</span>
</div>
<input class="w-full h-1.5 bg-slate-300 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-primary" max="100" min="0" type="range" value="80"/>
</div>
<div class="space-y-3">
<div class="flex justify-between items-center px-1">
<span class="text-sm font-medium">Publishing Share</span>
<span class="text-lg font-mono font-bold text-primary">100%</span>
</div>
<input class="w-full h-1.5 bg-slate-300 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-primary" max="100" min="0" type="range" value="100"/>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Bar -->
<footer class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-xl p-6 border-t border-primary/10 z-30">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-outfit font-bold text-lg h-16 rounded-2xl shadow-xl shadow-primary/20 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">save</span>
                Save Metadata
            </button>
</footer>
</div>
</body></html>
