<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SoundGrid Role Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#6961ff",
                        "background-light": "#f5f5f8",
                        "background-dark": "#0f0f13",
                        "surface": "#1a1a24",
                        "border-mute": "#2a2a3d",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Spline Sans', sans-serif;
        }
        .active-card {
            border-color: #6961ff;
            box-shadow: 0 0 15px rgba(105, 97, 255, 0.2);
        }
        .custom-radio:checked {
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3ccircle cx='8' cy='8' r='3'/%3e%3c/svg%3e");
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-display">
<!-- Top Navigation Bar -->
<header class="flex items-center justify-between p-4 sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">arrow_back</span>
</button>
<span class="text-primary font-bold tracking-tight text-lg">SoundGrid</span>
<div class="size-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 px-6 pb-24">
<!-- Header Section -->
<div class="pt-6 pb-8">
<h1 class="text-slate-900 dark:text-slate-100 text-3xl font-bold leading-tight tracking-tight mb-2">
                Select Your Role
            </h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal">
                Choose your primary workspace to customize your experience.
            </p>
</div>
<!-- Role Selection Cards -->
<div class="flex flex-col gap-4">
<!-- Artist Card -->
<label class="relative flex items-center gap-4 rounded-xl border border-border-mute bg-surface p-4 cursor-pointer transition-all hover:border-primary/50">
<div class="flex-1 flex flex-col">
<span class="text-slate-100 text-base font-semibold">Artist</span>
<span class="text-slate-400 text-sm">Create and share your music</span>
</div>
<input class="custom-radio size-6 border-2 border-border-mute bg-transparent text-primary checked:bg-primary checked:border-primary focus:ring-0 focus:ring-offset-0 rounded-full" name="role" type="radio"/>
</label>
<!-- Producer Card (Active State) -->
<label class="relative flex items-center gap-4 rounded-xl border-2 border-primary bg-surface p-4 cursor-pointer active-card transition-all">
<div class="flex-1 flex flex-col">
<span class="text-slate-100 text-base font-semibold">Producer</span>
<span class="text-slate-400 text-sm">Produce and master tracks</span>
</div>
<input checked="" class="custom-radio size-6 border-2 border-primary bg-primary text-white checked:bg-primary checked:border-primary focus:ring-0 focus:ring-offset-0 rounded-full" name="role" type="radio"/>
</label>
<!-- Supervisor Card -->
<label class="relative flex items-center gap-4 rounded-xl border border-border-mute bg-surface p-4 cursor-pointer transition-all hover:border-primary/50">
<div class="flex-1 flex flex-col">
<span class="text-slate-100 text-base font-semibold">Supervisor</span>
<span class="text-slate-400 text-sm">Curate music for media</span>
</div>
<input class="custom-radio size-6 border-2 border-border-mute bg-transparent text-primary checked:bg-primary checked:border-primary focus:ring-0 focus:ring-offset-0 rounded-full" name="role" type="radio"/>
</label>
<!-- Venue Card -->
<label class="relative flex items-center gap-4 rounded-xl border border-border-mute bg-surface p-4 cursor-pointer transition-all hover:border-primary/50">
<div class="flex-1 flex flex-col">
<span class="text-slate-100 text-base font-semibold">Venue</span>
<span class="text-slate-400 text-sm">Manage events and bookings</span>
</div>
<input class="custom-radio size-6 border-2 border-border-mute bg-transparent text-primary checked:bg-primary checked:border-primary focus:ring-0 focus:ring-offset-0 rounded-full" name="role" type="radio"/>
</label>
<!-- Manager Card -->
<label class="relative flex items-center gap-4 rounded-xl border border-border-mute bg-surface p-4 cursor-pointer transition-all hover:border-primary/50">
<div class="flex-1 flex flex-col">
<span class="text-slate-100 text-base font-semibold">Manager</span>
<span class="text-slate-400 text-sm">Oversee talent and business</span>
</div>
<input class="custom-radio size-6 border-2 border-border-mute bg-transparent text-primary checked:bg-primary checked:border-primary focus:ring-0 focus:ring-offset-0 rounded-full" name="role" type="radio"/>
</label>
</div>
</main>
<!-- Bottom Action Button -->
<footer class="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-background-dark via-background-dark/95 to-transparent">
<button class="w-full h-14 bg-primary text-white text-lg font-bold rounded-xl shadow-lg shadow-primary/20 hover:bg-primary/90 transition-all flex items-center justify-center gap-2">
            Continue
            <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</footer>
<!-- Decorative background element for modern feel -->
<div class="fixed top-[-10%] right-[-10%] size-64 bg-primary/10 blur-[100px] pointer-events-none rounded-full"></div>
<div class="fixed bottom-[10%] left-[-10%] size-80 bg-primary/5 blur-[120px] pointer-events-none rounded-full"></div>
</body></html>
