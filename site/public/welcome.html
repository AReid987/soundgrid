<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SoundGrid Welcome Success</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#6961ff",
                        "accent-teal": "#00D4AA",
                        "background-light": "#f5f5f8",
                        "background-dark": "#0F0F13",
                    },
                    fontFamily: {
                        "display": ["Outfit", "Spline Sans", "sans-serif"],
                        "body": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Spline Sans', sans-serif;
        }
        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-hidden max-w-md mx-auto">
<!-- Top App Bar -->
<div class="flex items-center p-4 justify-between">
<button class="text-slate-900 dark:text-slate-100 flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<div class="w-10"></div> <!-- Spacer for centering title if needed, or keeping symmetry -->
</div>
<!-- Content Area -->
<div class="flex flex-col flex-1 px-8 justify-center items-center text-center">
<!-- Success Icon/Illustration Section -->
<div class="mb-12 relative flex items-center justify-center">
<!-- Glow Effect -->
<div class="absolute w-32 h-32 bg-accent-teal/20 blur-3xl rounded-full"></div>
<!-- Main Checkmark Circle -->
<div class="relative flex items-center justify-center w-24 h-24 rounded-full border-4 border-accent-teal bg-background-dark shadow-[0_0_30px_rgba(0,212,170,0.3)]">
<span class="material-symbols-outlined text-accent-teal text-5xl font-bold">check</span>
</div>
</div>
<!-- Success Message -->
<div class="space-y-4 max-w-xs">
<h1 class="font-outfit text-3xl font-bold leading-tight tracking-tight text-slate-900 dark:text-slate-100">
                    You're all set
                </h1>
<p class="text-slate-600 dark:text-slate-400 text-base leading-relaxed font-body">
                    Your professional profile is active. You can now start managing your music business with precision.
                </p>
</div>
<!-- Visual Decoration / Abstract Image -->
<div class="mt-12 w-full aspect-video rounded-xl bg-gradient-to-br from-primary/10 via-background-dark to-accent-teal/10 border border-primary/10 flex items-center justify-center overflow-hidden" data-alt="Abstract musical waveform pattern in dark purple and teal">
<div class="opacity-20 flex gap-1 items-end h-16">
<div class="w-1.5 h-8 bg-primary rounded-full"></div>
<div class="w-1.5 h-12 bg-primary rounded-full"></div>
<div class="w-1.5 h-16 bg-accent-teal rounded-full"></div>
<div class="w-1.5 h-10 bg-primary rounded-full"></div>
<div class="w-1.5 h-14 bg-accent-teal rounded-full"></div>
<div class="w-1.5 h-6 bg-primary rounded-full"></div>
<div class="w-1.5 h-12 bg-accent-teal rounded-full"></div>
<div class="w-1.5 h-9 bg-primary rounded-full"></div>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="p-6 pb-10 space-y-4">
<button class="w-full h-14 flex items-center justify-center rounded-xl bg-primary text-white text-lg font-bold font-outfit shadow-lg shadow-primary/20 active:scale-[0.98] transition-all">
                Create first contract
            </button>
<button class="w-full h-12 flex items-center justify-center rounded-xl bg-slate-200 dark:bg-slate-800/50 text-slate-700 dark:text-slate-300 text-sm font-semibold font-body active:scale-[0.98] transition-all">
                Go to Dashboard
            </button>
</div>
</div>
</body></html>
