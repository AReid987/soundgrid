<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SoundGrid | Professional Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#6961ff",
                        "background-light": "#f5f5f8",
                        "background-dark": "#0F0F13",
                        "surface-dark": "#1A1A24",
                        "surface-elevated": "#242434",
                        "border-muted": "#3D3D56",
                    },
                    fontFamily: {
                        "display": ["Outfit", "Inter", "sans-serif"],
                        "sans": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Outfit', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">
<div class="w-full max-w-[440px] flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-10 flex flex-col items-center gap-3">
<div class="bg-primary p-3 rounded-xl shadow-lg shadow-primary/20">
<svg class="w-8 h-8 text-white" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M44 11.2727C44 14.0109 39.8386 16.3957 33.69 17.6364C39.8386 18.877 44 21.2618 44 24C44 26.7382 39.8386 29.123 33.69 30.3636C39.8386 31.6043 44 33.9891 44 36.7273C44 40.7439 35.0457 44 24 44C12.9543 44 4 40.7439 4 36.7273C4 33.9891 8.16144 31.6043 14.31 30.3636C8.16144 29.123 4 26.7382 4 24C4 21.2618 8.16144 18.877 14.31 17.6364C8.16144 16.3957 4 14.0109 4 11.2727C4 7.25611 12.9543 4 24 4C35.0457 4 44 7.25611 44 11.2727Z" fill="currentColor"></path>
</svg>
</div>
<h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">SoundGrid</h1>
</div>
<!-- Form Container -->
<div class="w-full bg-white dark:bg-surface-dark p-8 rounded-xl shadow-2xl border border-slate-200 dark:border-border-muted/30">
<div class="text-center mb-8">
<h2 class="text-xl font-semibold text-slate-900 dark:text-slate-100">Welcome Back</h2>
<p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Enter your credentials to access your studio</p>
</div>
<form class="space-y-5">
<!-- Email Input -->
<div class="space-y-2">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Email Address</label>
<div class="relative">
<input class="w-full h-12 bg-slate-100 dark:bg-surface-elevated border-none focus:ring-2 focus:ring-primary text-slate-900 dark:text-white rounded-lg px-4 placeholder:text-slate-400 dark:placeholder:text-slate-500 transition-all" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
<a class="text-xs text-primary hover:underline font-medium" href="#">Forgot?</a>
</div>
<div class="relative group">
<input class="w-full h-12 bg-slate-100 dark:bg-surface-elevated border-none focus:ring-2 focus:ring-primary text-slate-900 dark:text-white rounded-lg px-4 pr-12 placeholder:text-slate-400 dark:placeholder:text-slate-500 transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full h-12 bg-primary hover:bg-primary/90 text-white font-semibold rounded-lg shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 mt-2" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Separator -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200 dark:border-border-muted/50"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-white dark:bg-surface-dark px-4 text-slate-500 dark:text-slate-400 font-medium tracking-widest">or continue with</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 h-12 border border-slate-200 dark:border-border-muted rounded-lg hover:bg-slate-50 dark:hover:bg-white/5 transition-all">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-sm font-medium dark:text-slate-200">Google</span>
</button>
<button class="flex items-center justify-center gap-2 h-12 border border-slate-200 dark:border-border-muted rounded-lg hover:bg-slate-50 dark:hover:bg-white/5 transition-all">
<svg class="w-5 h-5 dark:fill-white fill-slate-900" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.04-.48-3.15 0-1.46.61-2.21.43-3.11-.42C3.39 15.93 4.1 8.8 8.81 8.5c1.19.07 2 .76 2.7 .78.91-.03 2.17-.86 3.48-.73 1.54.15 2.68.74 3.36 1.74-3.1 1.86-2.58 6.09.43 7.33-.6 1.49-1.4 2.94-2.3 3.92a20.08 20.08 0 0 1-.43-.26zM12.03 7.25c-.23-2.18 1.45-4.14 3.42-4.25.3.2.56.45.75.76a4.4 4.4 0 0 1 .45 3.31c-2.15.17-4.33-1.84-4.62-4.82z"></path>
</svg>
<span class="text-sm font-medium dark:text-slate-200">Apple</span>
</button>
</div>
</div>
<!-- Footer Info -->
<p class="mt-10 text-slate-500 dark:text-slate-400 text-sm text-center">
            Don't have an account? 
            <a class="text-primary font-semibold hover:underline" href="#">Request Invitation</a>
</p>
<!-- Legal Links -->
<div class="mt-20 flex gap-6 text-xs text-slate-400 dark:text-slate-600 font-medium">
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="hover:text-primary transition-colors" href="#">Support</a>
</div>
</div>
</body></html>
