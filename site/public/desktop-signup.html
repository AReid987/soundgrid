<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SoundGrid | Create Account</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#6961ff",
                        "background-light": "#f5f5f8",
                        "background-dark": "#0F0F13",
                        "surface-dark": "#1A1A24",
                        "elevated-dark": "#242434",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Space Grotesk', sans-serif;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<div class="flex-1 flex flex-col items-center justify-center p-6 lg:p-12">
<!-- Logo Section -->
<div class="mb-10 flex flex-col items-center gap-3">
<div class="text-primary">
<svg class="w-12 h-12" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M44 11.2727C44 14.0109 39.8386 16.3957 33.69 17.6364C39.8386 18.877 44 21.2618 44 24C44 26.7382 39.8386 29.123 33.69 30.3636C39.8386 31.6043 44 33.9891 44 36.7273C44 40.7439 35.0457 44 24 44C12.9543 44 4 40.7439 4 36.7273C4 33.9891 8.16144 31.6043 14.31 30.3636C8.16144 29.123 4 26.7382 4 24C4 21.2618 8.16144 18.877 14.31 17.6364C8.16144 16.3957 4 14.0109 4 11.2727C4 7.25611 12.9543 4 24 4C35.0457 4 44 7.25611 44 11.2727Z" fill="currentColor"></path>
</svg>
</div>
<h1 class="text-2xl font-bold tracking-tight text-slate-100">SoundGrid</h1>
</div>
<!-- Card Container -->
<div class="w-full max-w-[480px] bg-surface-dark rounded-xl shadow-2xl border border-primary/10 overflow-hidden">
<div class="p-8 lg:p-10">
<div class="mb-8">
<h2 class="text-2xl font-bold text-slate-100 mb-2">Create Account</h2>
<p class="text-slate-400 text-sm">Join the professional music industry platform.</p>
</div>
<form class="space-y-5">
<!-- Full Name -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-300">Full Name</label>
<input class="w-full h-12 px-4 rounded-lg bg-elevated-dark border border-slate-700/50 text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-slate-500" placeholder="Enter your full name" type="text"/>
</div>
<!-- Email -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-300">Email Address</label>
<input class="w-full h-12 px-4 rounded-lg bg-elevated-dark border border-slate-700/50 text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-slate-500" placeholder="name@company.com" type="email"/>
</div>
<!-- Password -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-300">Password</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-lg bg-elevated-dark border border-slate-700/50 text-slate-100 focus:ring-2 focus:ring-primary focus:border-transparent transition-all placeholder:text-slate-500" placeholder="Min. 8 characters" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- CTA -->
<button class="w-full h-12 bg-primary hover:bg-primary/90 text-white font-bold rounded-lg transition-colors mt-4 shadow-lg shadow-primary/20" type="submit">
                        Create Account
                    </button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-700/50"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-surface-dark px-2 text-slate-500">Or continue with</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4 mb-8">
<button class="flex items-center justify-center gap-2 h-11 rounded-lg bg-elevated-dark border border-slate-700/50 hover:bg-slate-700/30 transition-colors text-sm font-medium">
<img alt="Google" class="w-5 h-5" data-alt="Google logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAvffIBrO2bCtIsqbxGxbTKw33PhIOZcSBTzF5G-AHEuFo8HNGBcF0yU_D7zcMmsrAnGbZ0OOg35iHJEV1w7wuxL7qHDYIvo9MT28x-xPoirhbfFd8NKYXWqJ3wI4AmpMLM4qk87dCgqgyJD5tsnOPZEsBC09kdwfe93NyS4E1o7c8l_lEN5ZaaiTXFtc8YsGv74UyAccde8m8heu6xZYNMGYfyB2-lY2bWTe2pF9tGKiqbvRglHWCRMMHWSQKKGr43UV51b5nX7w"/>
                        Google
                    </button>
<button class="flex items-center justify-center gap-2 h-11 rounded-lg bg-elevated-dark border border-slate-700/50 hover:bg-slate-700/30 transition-colors text-sm font-medium">
<img alt="Apple" class="w-5 h-5" data-alt="Apple logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC1eU-woiaRe0ax8SS8u_GVO8-Mm31P8HZHs9_a1jnvYGeqCgCsqA-uS2iyjs22h6tbDZiu0u_P8HS4IiRH39bDRQuKF0oe4zWy9F6arbY5zmThYi9deNJNe9cnwphpoR6IM7aG3z_VSlXr8i7GqZOE0XQgDavZvTzJXwx3gww49W4cxT_rHewd0vDsRRz7MZZ1Gjyh52jjOjHlZPQUHwB2MEACQuV0xQL6gOp3HKijesJU0KDbc-tfzxv2vrn2qvKcEjWPA6yekw"/>
                        Apple
                    </button>
</div>
<!-- Footer Link -->
<div class="text-center">
<p class="text-slate-400 text-sm">
                        Already have an account? 
                        <a class="text-primary font-semibold hover:underline decoration-2 underline-offset-4" href="#">Sign in instead</a>
</p>
</div>
</div>
</div>
<!-- Legal Links -->
<div class="mt-8 flex gap-6 text-xs text-slate-500 font-medium">
<a class="hover:text-slate-300" href="#">Terms of Service</a>
<a class="hover:text-slate-300" href="#">Privacy Policy</a>
<a class="hover:text-slate-300" href="#">Cookie Settings</a>
</div>
</div>
</body></html>
