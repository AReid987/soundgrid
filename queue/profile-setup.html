<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SoundGrid Profile Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#6961ff",
                        "background-light": "#f5f5f8",
                        "background-dark": "#0F0F13",
                        "surface": "#242434",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Spline Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .ios-status-bar {
            height: 44px;
        }
        .form-input:focus {
            box-shadow: 0 0 0 2px rgba(105, 97, 255, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-display">
<!-- iOS Status Bar Spacer -->
<div class="ios-status-bar w-full"></div>
<!-- Top Navigation -->
<header class="flex items-center px-6 py-4">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">arrow_back_ios_new</span>
</button>
<h1 class="flex-1 text-center text-xl font-bold tracking-tight pr-10">Set up your profile</h1>
</header>
<main class="flex-1 flex flex-col px-6 pt-8 pb-10 max-w-md mx-auto w-full">
<!-- Avatar Upload Component -->
<div class="flex flex-col items-center mb-10">
<div class="relative group">
<div class="size-32 rounded-full bg-surface flex items-center justify-center border-2 border-dashed border-slate-700 overflow-hidden" data-alt="User profile avatar placeholder with abstract pattern" style="background-image: linear-gradient(135deg, #242434 0%, #1a1a2e 100%);">
<span class="material-symbols-outlined text-4xl text-slate-500">person</span>
</div>
<button class="absolute bottom-0 right-0 bg-primary text-white size-10 rounded-full flex items-center justify-center border-4 border-background-dark shadow-lg active:scale-95 transition-transform">
<span class="material-symbols-outlined text-xl">add</span>
</button>
</div>
<p class="mt-4 text-sm font-medium text-slate-400">Tap to upload photo</p>
</div>
<!-- Form Fields -->
<div class="space-y-6 flex-1">
<div class="space-y-2">
<label class="text-xs font-semibold uppercase tracking-wider text-slate-500 ml-1">Display Name</label>
<div class="relative">
<input class="w-full h-14 bg-surface border-none rounded-lg px-4 text-slate-100 placeholder:text-slate-500 focus:ring-2 focus:ring-primary transition-all" placeholder="e.g. Alex Rivera" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="text-xs font-semibold uppercase tracking-wider text-slate-500 ml-1">Location</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xl">location_on</span>
<input class="w-full h-14 bg-surface border-none rounded-lg pl-12 pr-4 text-slate-100 placeholder:text-slate-500 focus:ring-2 focus:ring-primary transition-all" data-location="Los Angeles, USA" placeholder="City, Country" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="text-xs font-semibold uppercase tracking-wider text-slate-500 ml-1">Genre</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xl">music_note</span>
<select class="w-full h-14 bg-surface border-none rounded-lg pl-12 pr-10 text-slate-100 appearance-none focus:ring-2 focus:ring-primary transition-all">
<option disabled="" selected="" value="">Select your primary genre</option>
<option value="electronic">Electronic / Techno</option>
<option value="hiphop">Hip Hop / Rap</option>
<option value="indie">Indie / Alternative</option>
<option value="pop">Pop</option>
<option value="jazz">Jazz / Soul</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Action Button -->
<div class="mt-12">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-[0_8px_30px_rgb(105,97,255,0.3)] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                Finish Setup
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center text-slate-500 text-sm mt-6 px-4">
                By continuing, you agree to SoundGrid's <span class="text-primary font-medium">Terms of Service</span> and <span class="text-primary font-medium">Privacy Policy</span>.
            </p>
</div>
</main>
<!-- iOS Home Indicator Spacer -->
<div class="h-8 w-full"></div>
</body></html>
