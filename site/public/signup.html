<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#6c63ff",
                        "background-light": "#f5f5f8",
                        "background-dark": "#0f0f13",
                        "surface": "#242434",
                        "border-muted": "#3d3d56",
                    },
                    fontFamily: {
                        "display": ["Outfit", "sans-serif"],
                        "body": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<title>SoundGrid Sign In</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
<div class="flex items-center p-4 pb-2 justify-between">
<div class="text-slate-900 dark:text-white flex size-12 shrink-0 items-center">
<span class="material-symbols-outlined text-2xl">arrow_back_ios</span>
</div>
</div>
<div class="flex flex-col items-center px-6 pt-8 pb-10">
<div class="w-20 h-20 bg-primary rounded-xl flex items-center justify-center mb-6 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-white text-5xl">grid_view</span>
</div>
<h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white">SoundGrid</h1>
<p class="text-slate-500 dark:text-slate-400 mt-2 font-body">Music Industry Professional Platform</p>
</div>
<div class="flex flex-col gap-6 px-6 w-full max-w-md mx-auto">
<h2 class="text-2xl font-bold leading-tight text-slate-900 dark:text-white mb-2">Sign In</h2>
<div class="flex flex-col gap-4">
<label class="flex flex-col gap-2">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Email Address</span>
<input class="form-input flex w-full rounded-lg border-none bg-slate-200 dark:bg-surface text-slate-900 dark:text-white focus:ring-2 focus:ring-primary h-14 placeholder:text-slate-500 dark:placeholder:text-slate-500 p-4 text-base font-normal" placeholder="name@company.com" type="email"/>
</label>
<label class="flex flex-col gap-2">
<span class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Password</span>
<div class="relative flex w-full items-center">
<input class="form-input flex w-full rounded-lg border-none bg-slate-200 dark:bg-surface text-slate-900 dark:text-white focus:ring-2 focus:ring-primary h-14 placeholder:text-slate-500 dark:placeholder:text-slate-500 p-4 text-base font-normal pr-12" placeholder="Enter your password" type="password"/>
<button class="absolute right-4 text-slate-500 dark:text-slate-400 flex items-center justify-center">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</label>
</div>
<div class="flex justify-end">
<a class="text-sm font-medium text-primary hover:underline" href="#">Forgot password?</a>
</div>
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold h-14 rounded-lg transition-colors shadow-lg shadow-primary/20">
                Sign In
            </button>
<div class="flex items-center gap-4 my-4">
<div class="h-px flex-1 bg-slate-300 dark:bg-border-muted"></div>
<span class="text-sm font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">or</span>
<div class="h-px flex-1 bg-slate-300 dark:bg-border-muted"></div>
</div>
<div class="flex flex-col gap-3">
<button class="flex items-center justify-center gap-3 w-full h-14 rounded-lg border border-slate-300 dark:border-border-muted bg-transparent hover:bg-slate-100 dark:hover:bg-white/5 transition-colors font-semibold">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Continue with Google
                </button>
<button class="flex items-center justify-center gap-3 w-full h-14 rounded-lg border border-slate-300 dark:border-border-muted bg-transparent hover:bg-slate-100 dark:hover:bg-white/5 transition-colors font-semibold">
<span class="material-symbols-outlined text-xl">ios</span>
                    Continue with Apple
                </button>
</div>
<p class="text-center text-slate-500 dark:text-slate-400 mt-6 font-body">
                Don't have an account? 
                <a class="text-primary font-bold hover:underline" href="#">Sign Up</a>
</p>
</div>
<div class="mt-auto p-6 flex flex-col items-center">
<div class="w-full h-48 rounded-xl bg-gradient-to-br from-primary/20 to-surface overflow-hidden relative" data-alt="Abstract music visualization pattern with glowing lines">
<div class="absolute inset-0 flex items-center justify-center opacity-30">
<span class="material-symbols-outlined text-8xl text-primary">equalizer</span>
</div>
</div>
</div>
</div>
</body></html>
